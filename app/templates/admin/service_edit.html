{% extends 'admin/base.html' %}
{% block content %}
  <h2>Edit Service</h2>
  {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}

  <form method="post" action="/admin/services/{{ service.id }}/edit">
    <label>Name</label><br />
    <input type="text" name="name" value="{{ service.name }}" required /><br /><br />

    <label>
      <input type="checkbox" name="is_active" {% if service.is_active %}checked{% endif %} /> Active
    </label><br /><br />

    <button type="submit">Save</button>
  </form>
{% endblock %}
